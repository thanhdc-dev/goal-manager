<div
  class="min-h-screen flex items-center justify-center p-8 bg-gradient-to-br from-indigo-500/5 to-app-bg dark:from-indigo-950/10 dark:to-app-bg transition-colors duration-250">
  <div
    class="w-full max-w-[480px] p-10 bg-white/80 dark:bg-app-card/85 backdrop-blur-xl border border-white/20 dark:border-app-border rounded-[32px] shadow-2xl shadow-indigo-500/5 animate-[slideUp_0.6s_cubic-bezier(0.16,1,0.3,1)]">
    <div class="brand text-center mb-10">
      <div
        class="logo w-16 h-16 mx-auto mb-6 bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
        <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
      </div>
      <h1
        class="text-3xl font-extrabold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300">
        Goal Tracker</h1>
      <p class="text-slate-500 dark:text-app-muted text-sm font-medium leading-relaxed">Đồng bộ hóa mục tiêu của bạn
        trên mọi thiết bị</p>
    </div>

    <div class="providers space-y-3">
      @for (p of providers; track p.key) {
      <button type="button" [disabled]="loading() !== null" (click)="loginWith(p.key)"
        class="w-full py-4 px-6 rounded-2xl bg-white dark:bg-app-surface text-slate-700 dark:text-app-text font-semibold text-base border-2 border-slate-150 dark:border-app-border transition-all duration-300 flex items-center justify-center gap-3 hover:bg-slate-50 dark:hover:bg-slate-800/50 hover:border-slate-300 dark:hover:border-slate-700 hover:shadow-md hover:-translate-y-[2px] active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
        @if (loading() === p.key) {
        <span
          class="w-5 h-5 border-2 border-slate-400 border-t-slate-800 dark:border-white/30 dark:border-t-white rounded-full animate-spin"></span>
        } @else {
        @switch (p.key) {
        @case ('google') {
        <svg class="w-5 h-5" viewBox="0 0 24 24" width="100%" height="100%">
          <path fill="#EA4335"
            d="M12 5.04c1.62 0 3.08.56 4.22 1.65l3.16-3.16C17.47 1.8 14.93 1 12 1 7.37 1 3.42 3.66 1.48 7.55l3.77 2.92C6.14 7.23 8.84 5.04 12 5.04z" />
          <path fill="#4285F4"
            d="M23.49 12.27c0-.81-.07-1.59-.2-2.34H12v4.43h6.44c-.28 1.46-1.1 2.69-2.34 3.52l3.65 2.83c2.13-1.97 3.36-4.87 3.36-8.44z" />
          <path fill="#FBBC05"
            d="M5.25 14.75a7.12 7.12 0 0 1 0-4.5L1.48 7.33A11.96 11.96 0 0 0 0 12c0 1.68.35 3.28.98 4.75l4.27-3z" />
          <path fill="#34A853"
            d="M12 23c3.24 0 5.97-1.07 7.96-2.92l-3.65-2.83c-1.01.68-2.31 1.09-3.95 1.09-3.16 0-5.86-2.19-6.81-5.16L1.68 16.1A11.96 11.96 0 0 0 12 23z" />
        </svg>
        }
        @case ('github') {
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1.13-.02-2.05-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.76.11 3.05.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.41.35.77 1.05.77 2.12 0 1.53-.01 2.76-.01 3.14 0 .31.21.68.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z" />
        </svg>
        }
        @case ('zalo') {
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
          <path fill="#0068FF"
            d="M12 1.5C5.9 1.5 1 5.9 1 11.3c0 3.1 1.6 5.9 4.1 7.7V21l3.7-1.9c.7.2 1.4.3 2.2.3 6.1 0 11-4.4 11-9.8S18.1 1.5 12 1.5z" />
          <text x="12" y="14.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11"
            font-weight="700" fill="#FFFFFF">Z</text>
        </svg>
        }
        }
        }
        <span>{{ p.label }}</span>
      </button>
      }
    </div>

    @if (error()) {
    <div
      class="mt-6 p-4 rounded-2xl bg-rose-50 dark:bg-rose-950/20 text-rose-700 dark:text-app-red border border-rose-200 dark:border-app-red/20 text-sm text-center font-semibold animate-[fadeIn_0.3s_ease]">
      {{ error() }}
    </div>
    }
  </div>
</div>
