<div
  class="min-h-screen flex items-center justify-center p-8 bg-gradient-to-br from-indigo-500/5 to-app-bg dark:from-indigo-950/10 dark:to-app-bg transition-colors duration-250">
  <div
    class="w-full max-w-[480px] p-10 bg-white/80 dark:bg-app-card/85 backdrop-blur-xl border border-white/20 dark:border-app-border rounded-[32px] shadow-2xl shadow-indigo-500/5 animate-[slideUp_0.6s_cubic-bezier(0.16,1,0.3,1)]">
    <div class="brand text-center mb-10">
      <div
        class="logo w-16 h-16 mx-auto mb-6 bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
        <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
      </div>
      <h1
        class="text-3xl font-extrabold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300">
        Goal Tracker</h1>
      <p class="text-slate-500 dark:text-app-muted text-sm font-medium leading-relaxed">Đồng bộ hóa mục tiêu của bạn
        trên mọi thiết bị</p>
    </div>

    <form (submit)="onSubmit(); $event.preventDefault()">
      <div class="form-group mb-6">
        <label for="email"
          class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-app-muted mb-2 ml-2">Email</label>
        <input type="email" id="email" name="email" [ngModel]="email()" (ngModelChange)="email.set($event)"
          placeholder="your@email.com"
          class="w-full px-5 py-4 rounded-2xl border-2 border-slate-150 dark:border-app-border bg-slate-50/50 dark:bg-app-surface text-app-text text-base placeholder-slate-400 dark:placeholder-app-muted focus:outline-none focus:border-indigo-500 focus:bg-white dark:focus:bg-app-surface focus:ring-4 focus:ring-indigo-500/10 transition-all duration-300"
          required>
      </div>

      <button type="submit" [disabled]="loading()"
        class="w-full py-4 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-base transition-all duration-300 flex items-center justify-center gap-3 shadow-lg shadow-indigo-600/15 hover:shadow-indigo-600/25 hover:-translate-y-[2px] active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
        @if (loading()) {
        <span class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        } @else {
        Gửi liên kết đăng nhập
        }
      </button>
    </form>

    <!-- Đường phân cách hoặc -->
    <div class="relative flex py-6 items-center">
      <div class="flex-grow border-t border-slate-150 dark:border-app-border"></div>
      <span class="flex-shrink mx-4 text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-app-muted">Hoặc</span>
      <div class="flex-grow border-t border-slate-150 dark:border-app-border"></div>
    </div>

    <!-- Nút Google Đăng nhập Cao cấp -->
    <button type="button" [disabled]="googleLoading() || loading()" (click)="loginWithGoogle()"
      class="w-full py-4 px-6 rounded-2xl bg-white dark:bg-app-surface text-slate-700 dark:text-app-text font-semibold text-base border-2 border-slate-150 dark:border-app-border transition-all duration-300 flex items-center justify-center gap-3 hover:bg-slate-50 dark:hover:bg-slate-800/50 hover:border-slate-300 dark:hover:border-slate-700 hover:shadow-md hover:-translate-y-[2px] active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
      @if (googleLoading()) {
      <span class="w-5 h-5 border-2 border-slate-400 border-t-slate-800 dark:border-white/30 dark:border-t-white rounded-full animate-spin"></span>
      } @else {
      <!-- SVG Google Icon Chuẩn -->
      <svg class="w-5 h-5" viewBox="0 0 24 24" width="100%" height="100%">
        <path fill="#EA4335" d="M12 5.04c1.62 0 3.08.56 4.22 1.65l3.16-3.16C17.47 1.8 14.93 1 12 1 7.37 1 3.42 3.66 1.48 7.55l3.77 2.92C6.14 7.23 8.84 5.04 12 5.04z" />
        <path fill="#4285F4" d="M23.49 12.27c0-.81-.07-1.59-.2-2.34H12v4.43h6.44c-.28 1.46-1.1 2.69-2.34 3.52l3.65 2.83c2.13-1.97 3.36-4.87 3.36-8.44z" />
        <path fill="#FBBC05" d="M5.25 14.75a7.12 7.12 0 0 1 0-4.5L1.48 7.33A11.96 11.96 0 0 0 0 12c0 1.68.35 3.28.98 4.75l4.27-3z" />
        <path fill="#34A853" d="M12 23c3.24 0 5.97-1.07 7.96-2.92l-3.65-2.83c-1.01.68-2.31 1.09-3.95 1.09-3.16 0-5.86-2.19-6.81-5.16L1.68 16.1A11.96 11.96 0 0 0 12 23z" />
      </svg>
      <span>Tiếp tục với Google</span>
      }
    </button>

    @if (message()) {
    <div
      class="mt-6 p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/20 text-emerald-700 dark:text-app-green border border-emerald-200 dark:border-app-green/20 text-sm text-center font-semibold animate-[fadeIn_0.3s_ease]">
      {{ message() }}
    </div>
    }

    @if (error()) {
    <div
      class="mt-6 p-4 rounded-2xl bg-rose-50 dark:bg-rose-950/20 text-rose-700 dark:text-app-red border border-rose-200 dark:border-app-red/20 text-sm text-center font-semibold animate-[fadeIn_0.3s_ease]">
      {{ error() }}
    </div>
    }

    <div class="footer mt-8 text-center">
      <p class="text-xs text-slate-400 dark:text-app-muted leading-relaxed">Chúng tôi sẽ gửi một liên kết "Magic Link"
        đến email của bạn. Không cần mật khẩu!</p>
    </div>
  </div>
</div>
