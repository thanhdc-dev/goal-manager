<div class="log-form">
  <h4 class="form-title">{{ editLog ? "Sửa log" : "Thêm tiến độ" }}</h4>

  <div class="field-row">
    <div class="field">
      <label for="value">Giá trị ({{ unit }})</label>
      <input
        id="value"
        type="number"
        [(ngModel)]="value"
        placeholder="Nhập số..."
        [min]="isInteger() ? 0 : 0.01"
        [step]="isInteger() ? 1 : 0.01"
        (input)="onInput($event)"
      />
    </div>
    <div class="field">
      <label for="date">Ngày</label>
      <input id="date" type="date" [(ngModel)]="date" />
    </div>
  </div>

  <div class="field">
    <label for="note">Ghi chú (tuỳ chọn)</label>
    <input id="note" type="text" [(ngModel)]="note" placeholder="Mô tả ngắn..." />
  </div>

  @if (error) {
    <div class="error-msg">{{ error }}</div>
  }

  <div class="btn-row">
    <button class="btn-secondary" (click)="cancel()">Huỷ</button>
    <button class="btn-primary" (click)="submit()">
      {{ editLog ? "Lưu thay đổi" : "Thêm log" }}
    </button>
  </div>
</div>
